# Local development: `docker compose up` → frontend http://localhost:5173, API docs http://localhost:5173/api/docs
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: english_prep
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "english_prep"]
      interval: 2s
      retries: 15

  backend:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/english_prep
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/english_prep_test
      JWT_SECRET: dev-only-secret-change-me-in-production-0123456789
      COOKIE_SECURE: "false"
    volumes:
      - ./backend:/srv/backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    user: node
    working_dir: /srv/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/srv/frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
