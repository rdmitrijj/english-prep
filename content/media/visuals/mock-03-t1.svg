<rect x="558" y="355" width="146" height="104" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="631.0" y="393.0" text-anchor="middle">Minerals</text><text x="631.0" y="413.0" text-anchor="middle">added to</text><text x="631.0" y="433.0" text-anchor="middle">improve taste</text>
<circle cx="631.0" cy="355" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="631.0" y="360" text-anchor="middle" font-weight="bold">5</text>
<rect x="377" y="355" width="146" height="104" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="450.0" y="403.0" text-anchor="middle">Disinfected</text><text x="450.0" y="423.0" text-anchor="middle">with chlorine</text>
<circle cx="450.0" cy="355" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="450.0" y="360" text-anchor="middle" font-weight="bold">6</text>
