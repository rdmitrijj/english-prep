<text x="269.0" y="163.0" text-anchor="middle">Screens remove</text><text x="269.0" y="183.0" text-anchor="middle">fish and</text><text x="269.0" y="203.0" text-anchor="middle">seaweed</text>
<circle cx="269.0" cy="125" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="269.0" y="130" text-anchor="middle" font-weight="bold">2</text>
