<text x="88.0" y="163.0" text-anchor="middle">Seawater drawn</text><text x="88.0" y="183.0" text-anchor="middle">in through</text><text x="88.0" y="203.0" text-anchor="middle">intake pipe</text>
<circle cx="88.0" cy="125" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="88.0" y="130" text-anchor="middle" font-weight="bold">1</text>
