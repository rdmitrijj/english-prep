<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#222">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="560" fill="#fff"/>
<text x="450" y="42" text-anchor="middle" font-size="20" font-weight="bold">Producing olive oil</text>
<rect x="22" y="95" width="180" height="100" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="112" y="131" text-anchor="middle">Olives shaken from</text><text x="112" y="151" text-anchor="middle">trees onto nets</text><text x="112" y="171" text-anchor="middle">(Oct–Dec)</text>
<circle cx="112" cy="95" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="112" y="100" text-anchor="middle" font-weight="bold">1</text>
<rect x="247" y="95" width="180" height="100" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="337" y="141" text-anchor="middle">Taken to the mill</text><text x="337" y="161" text-anchor="middle">within 24 hours</text>
<circle cx="337" cy="95" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="337" y="100" text-anchor="middle" font-weight="bold">2</text>
<rect x="472" y="95" width="180" height="100" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="562" y="131" text-anchor="middle">Leaves removed</text><text x="562" y="151" text-anchor="middle">and olives</text><text x="562" y="171" text-anchor="middle">washed</text>
<circle cx="562" cy="95" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="562" y="100" text-anchor="middle" font-weight="bold">3</text>
<rect x="697" y="95" width="180" height="100" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="787" y="131" text-anchor="middle">Crushed into</text><text x="787" y="151" text-anchor="middle">a paste (with</text><text x="787" y="171" text-anchor="middle">the stones)</text>
<circle cx="787" cy="95" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="787" y="100" text-anchor="middle" font-weight="bold">4</text>
<rect x="697" y="300" width="180" height="100" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="787" y="336" text-anchor="middle">Paste stirred</text><text x="787" y="356" text-anchor="middle">slowly for</text><text x="787" y="376" text-anchor="middle">30–40 minutes</text>
<circle cx="787" cy="300" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="787" y="305" text-anchor="middle" font-weight="bold">5</text>
<rect x="472" y="300" width="180" height="100" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="562" y="336" text-anchor="middle">Spun in a</text><text x="562" y="356" text-anchor="middle">centrifuge to</text><text x="562" y="376" text-anchor="middle">separate the oil</text>
<circle cx="562" cy="300" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="562" y="305" text-anchor="middle" font-weight="bold">6</text>
<rect x="247" y="300" width="180" height="100" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="337" y="336" text-anchor="middle">Oil left to settle</text><text x="337" y="356" text-anchor="middle">in steel tanks</text><text x="337" y="376" text-anchor="middle">(4–6 weeks)</text>
<circle cx="337" cy="300" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="337" y="305" text-anchor="middle" font-weight="bold">7</text>
<rect x="22" y="300" width="180" height="100" rx="10" fill="#e6edf3" stroke="#333" stroke-width="1.5"/>
<text x="112" y="346" text-anchor="middle">Filtered</text><text x="112" y="366" text-anchor="middle">and bottled</text>
<circle cx="112" cy="300" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="112" y="305" text-anchor="middle" font-weight="bold">8</text>
<line x1="206" y1="145" x2="243" y2="145" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="431" y1="145" x2="468" y2="145" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="656" y1="145" x2="693" y2="145" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="787" y1="199" x2="787" y2="281" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="243" y1="350" x2="206" y2="350" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="468" y1="350" x2="431" y2="350" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="693" y1="350" x2="656" y2="350" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="562" y1="404" x2="562" y2="441" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="452" y="445" width="220" height="95" rx="10" fill="#f1ebdf" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="562" y="478" text-anchor="middle">Solid waste (skins</text><text x="562" y="498" text-anchor="middle">and stones) sold</text><text x="562" y="518" text-anchor="middle">as fuel</text>
</svg>
