<line x1="243" y1="350" x2="206" y2="350" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="787" y1="404" x2="787" y2="441" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<rect x="697" y="445" width="180" height="95" rx="10" fill="#f1ebdf" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="787" y="478" text-anchor="middle">Bottom layer</text><text x="787" y="498" text-anchor="middle">(glycerine) sold</text><text x="787" y="518" text-anchor="middle">to soap makers</text>
