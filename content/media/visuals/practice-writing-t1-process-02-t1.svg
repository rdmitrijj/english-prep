<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#222">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="560" fill="#fff"/>
<text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold">The life cycle of the dragonfly</text>
<rect x="360" y="73" width="180" height="84" rx="10" fill="#dbe6ee" stroke="#333" stroke-width="1.5"/>
<text x="450" y="110" text-anchor="middle">Female lays eggs</text><text x="450" y="130" text-anchor="middle">on water plants</text>
<circle cx="450" cy="73" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="450" y="78" text-anchor="middle" font-weight="bold">1</text>
<rect x="593" y="129" width="180" height="84" rx="10" fill="#dbe6ee" stroke="#333" stroke-width="1.5"/>
<text x="683" y="166" text-anchor="middle">Eggs hatch after</text><text x="683" y="186" text-anchor="middle">2–5 weeks</text>
<circle cx="773" cy="129" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="773" y="134" text-anchor="middle" font-weight="bold">2</text>
<rect x="690" y="263" width="180" height="84" rx="10" fill="#dbe6ee" stroke="#333" stroke-width="1.5"/>
<text x="780" y="290" text-anchor="middle">Nymph lives under</text><text x="780" y="310" text-anchor="middle">water and eats</text><text x="780" y="330" text-anchor="middle">small insects</text>
<circle cx="870" cy="263" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="870" y="268" text-anchor="middle" font-weight="bold">3</text>
<rect x="593" y="397" width="180" height="84" rx="10" fill="#dbe6ee" stroke="#333" stroke-width="1.5"/>
<text x="683" y="424" text-anchor="middle">Nymph sheds its</text><text x="683" y="444" text-anchor="middle">skin 10–15 times</text><text x="683" y="464" text-anchor="middle">over 1–3 years</text>
<circle cx="773" cy="397" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="773" y="402" text-anchor="middle" font-weight="bold">4</text>
<rect x="360" y="453" width="180" height="84" rx="10" fill="#f1ebdf" stroke="#333" stroke-width="1.5"/>
<text x="450" y="486" text-anchor="middle">Nymph climbs out</text><text x="450" y="506" text-anchor="middle">of the water up</text><text x="450" y="526" text-anchor="middle">a plant stem</text>
<circle cx="450" cy="453" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="450" y="458" text-anchor="middle" font-weight="bold">5</text>
<rect x="127" y="397" width="180" height="84" rx="10" fill="#f1ebdf" stroke="#333" stroke-width="1.5"/>
<text x="217" y="424" text-anchor="middle">Skin splits and</text><text x="217" y="444" text-anchor="middle">adult pulls itself</text><text x="217" y="464" text-anchor="middle">out</text>
<circle cx="127" cy="397" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="127" y="402" text-anchor="middle" font-weight="bold">6</text>
<rect x="30" y="263" width="180" height="84" rx="10" fill="#f1ebdf" stroke="#333" stroke-width="1.5"/>
<text x="120" y="290" text-anchor="middle">Wings dry and</text><text x="120" y="310" text-anchor="middle">harden</text><text x="120" y="330" text-anchor="middle">(2–3 hours)</text>
<circle cx="30" cy="263" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="30" y="268" text-anchor="middle" font-weight="bold">7</text>
<rect x="127" y="129" width="180" height="84" rx="10" fill="#f1ebdf" stroke="#333" stroke-width="1.5"/>
<text x="217" y="156" text-anchor="middle">Adult flies, feeds</text><text x="217" y="176" text-anchor="middle">and mates</text><text x="217" y="196" text-anchor="middle">(lives 4–8 weeks)</text>
<circle cx="127" cy="129" r="15" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="127" y="134" text-anchor="middle" font-weight="bold">8</text>
<line x1="545" y1="138" x2="588" y2="148" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="717" y1="218" x2="746" y2="258" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="746" y1="352" x2="717" y2="392" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="588" y1="462" x2="545" y2="472" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="355" y1="472" x2="312" y2="462" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="183" y1="392" x2="154" y2="352" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="154" y1="258" x2="183" y2="218" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="312" y1="148" x2="355" y2="138" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="268" text-anchor="middle" font-weight="bold">Key</text>
<rect x="372" y="285" width="30" height="20" fill="#dbe6ee" stroke="#333" stroke-width="1.5"/><text x="412" y="300">in the water</text>
<rect x="372" y="320" width="30" height="20" fill="#f1ebdf" stroke="#333" stroke-width="1.5"/><text x="412" y="335">out of the water</text>
</svg>
