[project]
name = "english-prep-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "email-validator>=2.2",
    "pwdlib[argon2]==0.3.1",
    "pyjwt==2.15.1",
    "openai==3.31.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
